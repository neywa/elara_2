name: elara_2
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+8

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  audioplayers: ^6.6.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: StoryFont
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aura_app_icon.png"